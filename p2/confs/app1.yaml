apiVersion: v1
kind: ConfigMap
metadata:
  name: app-html-1
data:
  index.html: |
    <html>
    <head><title>Rihoy APP1</title></head>
    <body>
      <h1> Welcome to the WEBAPP1 Rihoy </h1>
      <p> APP number one </p>
    </body>
    </html>

---

# Service
apiVersion: v1
kind: Service
metadata:
  name: service-app1
  labels:
    app: web-app-1
spec:
  selector:
    app: web-app-1
  ports:
    - protocol: TCP
      port: 80        # Exposed service port
      targetPort: 80  # Listened service port

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rihoy-app1
  labels:
    app: web-app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app-1
  template:
    metadata:
      labels:
        app: web-app-1
    spec:
      containers:
        - name: nginx-containers
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name : html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-html-1
