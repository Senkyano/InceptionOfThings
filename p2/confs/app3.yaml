apiVersion: v1
kind: ConfigMap
metadata:
  name: app-html-3
data:
  index.html: |
    <html>
    <head><title>Michen APP3</title></head>
    <body>
      <h1> Welcome to the WEBAPP3 Michen </h1>
      <p> Default app </p>
    </body>
    </html>

---

# Service
apiVersion: v1
kind: Service
metadata:
  name: service-app3
  labels:
    app: web-app-3
spec:
  selector:
    app: web-app-3
  ports:
    - protocol: TCP
      port: 80        # Exposed service port
      targetPort: 80  # Listened service port

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: michen-app3
  labels:
    app: web-app-3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app-3
  template:
    metadata:
      labels:
        app: web-app-3
    spec:
      containers:
        - name: nginx-containers
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-html-3