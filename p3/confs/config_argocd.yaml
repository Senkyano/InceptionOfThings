apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: partie3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Senkyano/InceptionOfThings.git
    targetRevision: Rithy # Branch
    path: /p3/app/
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true